<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Mini site de músicas">
  <title>Minhas Músicas</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <div class="logo">♫</div>
      <div>
        <h1>Minhas Músicas</h1>
        <p>Ouça e baixe as minhas músicas</p>
      </div>
    </div>
  </header>

  <main class="container">
    <section class="hero">
      <h2>Minhas músicas</h2>
      <p>Escolha uma música para ouvir ou baixar.</p>
      <input id="search" type="search" placeholder="Pesquisar música..." autocomplete="off">
    </section>

    <div id="status" class="status">A carregar músicas...</div>
    <section id="songs" class="songs-grid"></section>
  </main>

  <footer>
    <p>© <span id="year"></span> Minhas Músicas</p>
  </footer>

  <div id="player" class="player hidden">
    <div class="player-info">
      <img id="playerCover" src="covers/default.svg" alt="Capa">
      <div>
        <strong id="playerTitle">Nenhuma música</strong>
        <span id="playerArtist">—</span>
      </div>
    </div>
    <audio id="audio" controls></audio>
    <a id="downloadCurrent" class="download-btn" href="#" download>Baixar</a>
  </div>

  <script src="app.js"></script>
</body>
</html>
